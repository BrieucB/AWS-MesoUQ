name: Publish Benchmark Lab metadata backend
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact reviewed main commit whose immutable image was published
        type: string
        required: true
      expected_previous_source_commit:
        description: Exact reviewed source commit matching the currently deployed immutable image
        type: string
        required: true
      expected_existing_policy_sha256:
        description: SHA256 of the expected existing policy environment value (empty if absent)
        type: string
        required: true
        default: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-publishing-main
  cancel-in-progress: false
jobs:
  backend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-publishing
    steps:
      - name: Validate dispatch and mask private metadata
        shell: bash
        env:
          ROLE_INPUT: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          REGION_INPUT: ${{ secrets.AWS_REGION }}
          FUNCTION_INPUT: ${{ secrets.AWS_BACKEND_FUNCTION_NAME }}
          REPOSITORY_INPUT: ${{ secrets.AWS_ECR_REPOSITORY_URL }}
          POLICIES_INPUT: ${{ secrets.AWS_BENCHMARK_POLICIES }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          try:
              with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
                  inputs = json.load(event_file)['inputs']
              sha = inputs['expected_source_commit']
              policy_sha = inputs['expected_existing_policy_sha256']
              previous_sha = inputs['expected_previous_source_commit']
              if (os.environ['GITHUB_REF'] != 'refs/heads/main' or
                      os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or
                      sha != os.environ['GITHUB_SHA'] or
                      not re.fullmatch(r'[a-f0-9]{40}', sha) or
                      not re.fullmatch(r'[a-f0-9]{40}', previous_sha) or
                      not re.fullmatch(r'[a-f0-9]{64}', policy_sha)):
                  raise ValueError()
              role, region, function, repository, policies = [
                  os.environ[name] for name in ('ROLE_INPUT', 'REGION_INPUT', 'FUNCTION_INPUT',
                                               'REPOSITORY_INPUT', 'POLICIES_INPUT')]
              match = re.fullmatch(r'arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9_+=,.@/-]+', role)
              if (match is None or not re.fullmatch(r'[a-z]{2}-[a-z]+-[0-9]+', region) or
                      not re.fullmatch(r'[A-Za-z0-9_-]{1,64}', function)):
                  raise ValueError()
              prefix = match[1] + '.dkr.ecr.' + region + '.amazonaws.com/'
              if (not repository.startswith(prefix) or
                      not re.fullmatch(r'[a-z0-9][a-z0-9._/-]*', repository[len(prefix):]) or
                      not isinstance(json.loads(policies), dict)):
                  raise ValueError()
              for value in (role, match[1], function, repository, policies):
                  print('::add-mask::' + value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'), flush=True)
              function_arn = 'arn:aws:lambda:' + region + ':' + match[1] + ':function:' + function
              repository_arn = 'arn:aws:ecr:' + region + ':' + match[1] + ':repository/' + repository[len(prefix):]
              session = {'Version':'2012-10-17', 'Statement': [
                  {'Effect':'Allow', 'Action':['ecr:GetAuthorizationToken'], 'Resource':'*'},
                  {'Effect':'Allow', 'Action':['ecr:DescribeRepositories','ecr:BatchGetImage',
                       'ecr:GetDownloadUrlForLayer'], 'Resource':repository_arn},
                  {'Effect':'Allow', 'Action':['lambda:GetFunction','lambda:GetFunctionConfiguration',
                       'lambda:UpdateFunctionCode','lambda:UpdateFunctionConfiguration'], 'Resource':function_arn}]}
              values = [('PUBLICATION_ROLE_ARN',role), ('PUBLICATION_REGION',region),
                        ('BACKEND_FUNCTION_NAME',function), ('AWS_ECR_REPOSITORY_URL',repository),
                        ('EXPECTED_PREVIOUS_SOURCE_COMMIT',previous_sha), ('EXPECTED_POLICY_SHA256',policy_sha),
                        ('PUBLICATION_SESSION_POLICY',json.dumps(session,separators=(',',':'))),
                        ('BENCHMARK_POLICIES',json.dumps(json.loads(policies),separators=(',',':')))]
              with open(os.environ['GITHUB_ENV'],'a') as environment:
                  for name, value in values:
                      if '\n' in value or '\r' in value:
                          raise ValueError()
                      environment.write(name + '=' + value + '\n')
          except Exception:
              sys.exit('Backend publication inputs are missing or invalid; inspect them privately.')
          PY
      - name: Checkout exact reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout and run deployment tests without AWS
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests -p 'test_backend_publication.py' -v
      - name: Checkout pinned official credential client
        id: aws_action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: aws-actions/configure-aws-credentials
          ref: e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
          path: .publication-tools/aws-credentials
          persist-credentials: false
      - name: Set up Node 24 for pinned credential client
        id: aws_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Obtain ephemeral function-only deployment credentials privately
        run: python3 tools/private_aws_action.py --action-directory .publication-tools/aws-credentials --phase configure
      - name: Verify source image and publish with revision preconditions
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_CLI_AUTO_PROMPT: 'off'
          AWS_PAGER: ''
        run: python3 tools/publish_backend.py --source-commit "$GITHUB_SHA"
      - name: Clear ephemeral AWS credentials
        if: always() && steps.aws_action.outcome == 'success' && steps.aws_node.outcome == 'success'
        run: python3 tools/private_aws_action.py --action-directory .publication-tools/aws-credentials --phase cleanup
