name: Connector Darwin synthetic proof
on:
  pull_request:
    paths:
      - 'src/aws_mesouq/**'
      - 'tests/remote/test_auth_broker.py'
      - 'tests/remote/test_auth_platform.py'
      - 'tests/remote/test_benchmark_cli.py'
      - 'tests/fixtures/**'
      - 'services/aws_publishing/**'
      - '.github/workflows/connector-macos.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker-cli-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_MESOUQ_QA_EVIDENCE_DIR: /private/tmp/mesouq-darwin-broker-evidence
      AWS_MESOUQ_CLI_QA_EVIDENCE: /private/tmp/mesouq-cli-darwin-proof.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # existing repository pin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # official v5 ref resolved 2026-11-01
        with:
          python-version: '3.11'
      - name: Install synthetic test dependencies
        run: python -m pip install -e '.[test]' -e './services/aws_publishing'
      - name: Prepare private synthetic proof directory
        run: python -c 'import os; os.mkdir("/private/tmp/mesouq-darwin-broker-evidence", 0o700)'
      - name: Exercise real Darwin peers and managed worker processes
        run: >-
          python -m pytest tests/remote/test_auth_broker.py tests/remote/test_benchmark_cli.py tests/remote/test_auth_platform.py
          --basetemp=/private/tmp/mesouq-darwin-pytest -q
      - name: Require actual Darwin process proof
        run: |
          python - <<'PY'
          import json, pathlib, sys
          assert sys.platform == "darwin"
          proofs = [json.loads(p.read_text()) for p in pathlib.Path("/private/tmp/mesouq-darwin-broker-evidence").glob("*.json")]
          broker = [d for d in proofs if "worker_PIDs" in d]
          assert len(broker) == 1
          assert broker[0]["Darwin_actual_run"] is True
          assert len(set(broker[0]["worker_PIDs"])) >= 4
          assert broker[0]["synthetic_login_factory_calls"] == 1
          d = json.loads(pathlib.Path("/private/tmp/mesouq-cli-darwin-proof.json").read_text())
          assert d["darwin_actual_run"] is True
          assert len(set(d["worker_pids"])) >= 4
          assert d["login_calls"] == 1
          print("Actual Darwin peer PID and four-process restart proof passed; no OAuth/SSH/AWS calls.")
          PY
