[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-mesouq"
version = "0.1.0"
description = "Private AWS publishing for scientific workflows executed through individual HPC accounts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Brieuc Benvegnen"}]
dependencies = ["cryptography>=46"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
aws-mesouq-connect = "aws_mesouq.connector.cli:main"
aws-mesouq-connector = "aws_mesouq.connector.cli:main"

[project.urls]
Repository = "https://github.com/BrieucB/AWS-MesoUQ"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aws_mesouq*"]

[tool.setuptools.package-data]
aws_mesouq = ["presets/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --tb=short"
testpaths = ["tests", "services/aws_publishing/tests"]
